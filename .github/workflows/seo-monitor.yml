name: Daily SEO & Canonical Regression Monitor

on:
  schedule:
    # Run every day at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  seo-audit:
    name: Execute Comprehensive Live SEO Health Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Daily SEO Regression Monitor
        run: node scripts/monitor-seo-daily.mjs

      - name: Upload SEO Audit Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-seo-health-report
          path: .seo-reports/daily-seo-health.json
          retention-days: 30

